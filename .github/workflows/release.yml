name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: cargo test --workspace --locked
      # Compile everything before the release key exists on this runner: crates.io build scripts and
      # proc macros must never run while the key is unlocked in the keychain. package.sh's own
      # cargo build below is then a cached no-op.
      - name: Build (before importing the certificate)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked -p keylens-app --target aarch64-apple-darwin
          cargo build --release --locked -p keylens-app --target x86_64-apple-darwin
      - name: Import signing certificate
        env:
          P12: ${{ secrets.RELEASE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh
      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: keylens-dmg
          path: target/release-dist/Keylens-*.dmg*
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/app-version.sh)
          dmg="target/release-dist/Keylens-$version.dmg"
          sha=$(cut -d' ' -f1 "$dmg.sha256")
          scripts/release-notes.sh "$version" "$sha" > "$RUNNER_TEMP/notes.md"
          # The annotated tag's message becomes the notes shown in the in-app update dialog.
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/update-notes.txt"
          scripts/update-manifest.sh "$version" "$sha" "$RUNNER_TEMP/update-notes.txt" > "$RUNNER_TEMP/latest.json"
          # A pre-release (vX.Y.Z-rc1) must not become releases/latest, which every installed copy updates to.
          prerelease=()
          [[ $version == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" "$RUNNER_TEMP/latest.json" \
            --title "Keylens $version" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}"
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
