name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: cargo test --workspace
      - name: Import signing certificate
        env:
          P12: ${{ secrets.RELEASE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh
      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: keylens-dmg
          path: target/release-dist/Keylens-*.dmg*
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/app-version.sh)
          dmg="target/release-dist/Keylens-$version.dmg"
          scripts/release-notes.sh "$version" "$(cut -d' ' -f1 "$dmg.sha256")" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --title "Keylens $version" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
