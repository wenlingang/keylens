[package]
name = "windows-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone project, not part of the root workspace
[workspace]

[dependencies]
keylens-core = { path = "../../crates/keylens-core" }
gpui-kit = "0.7.3"
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
