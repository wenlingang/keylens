_version: 2
Panel:
  search_placeholder:
    en: "Search shortcuts, menus or keys (e.g. ⌘⇧ or shift)"
    zh-CN: "搜索快捷键、菜单或按键（如 ⌘⇧ 或 shift）"
    zh-TW: "搜尋快速鍵、選單或按鍵（如 ⌘⇧ 或 shift）"
    zh-HK: "搜尋快速鍵、選單或按鍵（如 ⌘⇧ 或 shift）"
    ja: "ショートカット、メニュー、キーを検索（例：⌘⇧、shift）"
  count:
    en: "%{count} shortcuts"
    zh-CN: "%{count} 个快捷键"
    zh-TW: "%{count} 個快速鍵"
    zh-HK: "%{count} 個快速鍵"
    ja: "%{count} 件のショートカット"
  execute:
    en: "Run"
    zh-CN: "执行"
    zh-TW: "執行"
    zh-HK: "執行"
    ja: "実行"
  close:
    en: "Close"
    zh-CN: "关闭"
    zh-TW: "關閉"
    zh-HK: "關閉"
    ja: "閉じる"
  how_menu:
    en: "Runs the menu item"
    zh-CN: "执行方式：点按菜单项"
    zh-TW: "執行方式：點按選單項目"
    zh-HK: "執行方式：點按選單項目"
    ja: "メニュー項目を実行"
  how_keys:
    en: "Sends the key strokes"
    zh-CN: "执行方式：模拟按键"
    zh-TW: "執行方式：模擬按鍵"
    zh-HK: "執行方式：模擬按鍵"
    ja: "キー操作を送信"
  how_disabled:
    en: "Currently unavailable"
    zh-CN: "当前不可用"
    zh-TW: "目前無法使用"
    zh-HK: "目前無法使用"
    ja: "現在は使用できません"
  community:
    en: "From community data"
    zh-CN: "来自社区数据"
    zh-TW: "來自社群資料"
    zh-HK: "來自社群資料"
    ja: "コミュニティデータ"
  loading:
    en: "Reading menus…"
    zh-CN: "正在读取菜单…"
    zh-TW: "正在讀取選單…"
    zh-HK: "正在讀取選單…"
    ja: "メニューを読み込み中…"
  no_match:
    en: "No shortcuts match “%{query}”"
    zh-CN: "没有匹配「%{query}」的快捷键"
    zh-TW: "沒有符合「%{query}」的快速鍵"
    zh-HK: "沒有符合「%{query}」的快速鍵"
    ja: "「%{query}」に一致するショートカットはありません"
  no_match_hint:
    en: "Try a key name such as shift or ⌘⇧"
    zh-CN: "试试按键名，如 shift、⌘⇧"
    zh-TW: "試試按鍵名稱，如 shift、⌘⇧"
    zh-HK: "試試按鍵名稱，如 shift、⌘⇧"
    ja: "shift や ⌘⇧ などのキー名で試してください"
  empty_title:
    en: "No shortcuts for this app yet"
    zh-CN: "这个应用暂时没有快捷键数据"
    zh-TW: "這個應用程式暫時沒有快速鍵資料"
    zh-HK: "這個應用程式暫時沒有快速鍵資料"
    ja: "このアプリのショートカットはまだありません"
  empty_body:
    en: "Its menus have no shortcuts and there is no community data for it."
    zh-CN: "它的菜单里没有快捷键，社区数据里也还没有它。"
    zh-TW: "它的選單裡沒有快速鍵，社群資料裡也還沒有它。"
    zh-HK: "它的選單裡沒有快速鍵，社群資料裡也還沒有它。"
    ja: "メニューにショートカットがなく、コミュニティデータもありません。"
  menu_unreadable:
    en: "Could not read this app's menus; showing community data only."
    zh-CN: "无法读取这个应用的菜单，只显示社区数据。"
    zh-TW: "無法讀取這個應用程式的選單，只顯示社群資料。"
    zh-HK: "無法讀取這個應用程式的選單，只顯示社群資料。"
    ja: "このアプリのメニューを読み取れませんでした。コミュニティデータのみ表示します。"
  perm_title:
    en: "Accessibility permission needed"
    zh-CN: "需要「辅助功能」权限"
    zh-TW: "需要「輔助使用」權限"
    zh-HK: "需要「輔助使用」權限"
    ja: "「アクセシビリティ」の許可が必要です"
  perm_body:
    en: "Keylens reads app menus and runs menu items for you."
    zh-CN: "Keylens 需要读取应用的菜单，并在你选择时替你点按菜单项。"
    zh-TW: "Keylens 需要讀取應用程式的選單，並在你選擇時替你點按選單項目。"
    zh-HK: "Keylens 需要讀取應用程式的選單，並在你選擇時替你點按選單項目。"
    ja: "Keylens はアプリのメニューを読み取り、選択したメニュー項目を実行します。"
  perm_hint:
    en: "It takes effect automatically once granted."
    zh-CN: "授权后自动生效，不需要重启。"
    zh-TW: "授權後自動生效，不需要重新啟動。"
    zh-HK: "授權後自動生效，不需要重新啟動。"
    ja: "許可すると自動的に有効になります。"
  open_settings:
    en: "Open System Settings"
    zh-CN: "打开系统设置"
    zh-TW: "打開系統設定"
    zh-HK: "打開系統設定"
    ja: "システム設定を開く"
Tray:
  permission_ok:
    en: "Accessibility: allowed"
    zh-CN: "辅助功能：已授权"
    zh-TW: "輔助使用：已授權"
    zh-HK: "輔助使用：已授權"
    ja: "アクセシビリティ：許可済み"
  permission_missing:
    en: "Accessibility: not allowed — open settings"
    zh-CN: "辅助功能：未授权，点此打开设置"
    zh-TW: "輔助使用：未授權，點此打開設定"
    zh-HK: "輔助使用：未授權，點此打開設定"
    ja: "アクセシビリティ：未許可（設定を開く）"
  open_data:
    en: "Open Shortcut Data Folder"
    zh-CN: "打开快捷键数据目录"
    zh-TW: "打開快速鍵資料夾"
    zh-HK: "打開快速鍵資料夾"
    ja: "ショートカットデータのフォルダを開く"
  data_errors:
    en: "%{count} data files have errors"
    zh-CN: "%{count} 个数据文件有错误"
    zh-TW: "%{count} 個資料檔案有錯誤"
    zh-HK: "%{count} 個資料檔案有錯誤"
    ja: "%{count} 件のデータファイルにエラー"
  quit:
    en: "Quit Keylens"
    zh-CN: "退出 Keylens"
    zh-TW: "結束 Keylens"
    zh-HK: "結束 Keylens"
    ja: "Keylens を終了"
