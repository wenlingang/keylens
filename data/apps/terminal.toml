#:schema ../schema.json
schema = 1

[app]
name = "Terminal"

[app.match]
macos = ["com.apple.Terminal"]

[[group]]
title = "Windows and Tabs"
i18n = { zh-Hans = "窗口和标签页", zh-Hant = "視窗和標籤頁", ja = "ウインドウとタブ" }

  [[group.shortcut]]
  title = "New Tab"
  i18n = { zh-Hans = "新建标签页", zh-Hant = "新增標籤頁", ja = "新規タブ" }
  keys = "Cmd+T"

  [[group.shortcut]]
  title = "Next Tab"
  i18n = { zh-Hans = "下一个标签页", zh-Hant = "下一個標籤頁", ja = "次のタブ" }
  keys = "Shift+Cmd+]"

  [[group.shortcut]]
  title = "Previous Tab"
  i18n = { zh-Hans = "上一个标签页", zh-Hant = "上一個標籤頁", ja = "前のタブ" }
  keys = "Shift+Cmd+["

  [[group.shortcut]]
  title = "Split Pane"
  i18n = { zh-Hans = "拆分窗格", zh-Hant = "分割面板", ja = "パネルを分割" }
  keys = "Cmd+D"

  [[group.shortcut]]
  title = "Clear to Start"
  i18n = { zh-Hans = "清除到开头", zh-Hant = "清除到開頭", ja = "先頭まで消去" }
  keys = "Cmd+K"

  [[group.shortcut]]
  title = "Find"
  i18n = { zh-Hans = "查找", zh-Hant = "尋找", ja = "検索" }
  keys = "Cmd+F"

[[group]]
title = "Shell Line Editing"
i18n = { zh-Hans = "命令行编辑", zh-Hant = "命令列編輯", ja = "シェルの行編集" }

  [[group.shortcut]]
  title = "Move to the Start of the Line"
  i18n = { zh-Hans = "移到行首", zh-Hant = "移到行首", ja = "行頭へ移動" }
  keys = "Ctrl+A"

  [[group.shortcut]]
  title = "Move to the End of the Line"
  i18n = { zh-Hans = "移到行尾", zh-Hant = "移到行尾", ja = "行末へ移動" }
  keys = "Ctrl+E"

  [[group.shortcut]]
  title = "Delete to the Start of the Line"
  i18n = { zh-Hans = "删除到行首", zh-Hant = "刪除到行首", ja = "行頭まで削除" }
  keys = "Ctrl+U"

  [[group.shortcut]]
  title = "Delete to the End of the Line"
  i18n = { zh-Hans = "删除到行尾", zh-Hant = "刪除到行尾", ja = "行末まで削除" }
  keys = "Ctrl+K"

  [[group.shortcut]]
  title = "Delete the Previous Word"
  i18n = { zh-Hans = "删除前一个单词", zh-Hant = "刪除前一個單字", ja = "前の単語を削除" }
  keys = "Ctrl+W"

  [[group.shortcut]]
  title = "Search Command History"
  i18n = { zh-Hans = "搜索命令历史", zh-Hant = "搜尋命令歷史", ja = "コマンド履歴を検索" }
  keys = "Ctrl+R"

  [[group.shortcut]]
  title = "Clear the Screen"
  i18n = { zh-Hans = "清屏", zh-Hant = "清除畫面", ja = "画面を消去" }
  keys = "Ctrl+L"

  [[group.shortcut]]
  title = "Interrupt the Running Command"
  i18n = { zh-Hans = "中断正在运行的命令", zh-Hant = "中斷正在執行的命令", ja = "実行中のコマンドを中断" }
  keys = "Ctrl+C"

  [[group.shortcut]]
  title = "End of Input (Exit the Shell)"
  i18n = { zh-Hans = "输入结束（退出 shell）", zh-Hant = "輸入結束（結束 shell）", ja = "入力の終了（シェルを終了）" }
  keys = "Ctrl+D"
