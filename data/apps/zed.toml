#:schema ../schema.json
schema = 1

[app]
name = "Zed"

[app.match]
macos = ["dev.zed.Zed"]

[[group]]
title = "General"
i18n = { zh-Hans = "常规", zh-Hant = "一般", ja = "一般" }

  [[group.shortcut]]
  title = "Command Palette"
  i18n = { zh-Hans = "命令面板", zh-Hant = "命令選擇區", ja = "コマンドパレット" }
  keys = "Shift+Cmd+P"

  [[group.shortcut]]
  title = "Open a File by Name"
  i18n = { zh-Hans = "按名称打开文件", zh-Hant = "依名稱打開檔案", ja = "名前でファイルを開く" }
  keys = "Cmd+P"

  [[group.shortcut]]
  title = "Search in the Project"
  i18n = { zh-Hans = "在项目中搜索", zh-Hant = "在專案中搜尋", ja = "プロジェクト内を検索" }
  keys = "Shift+Cmd+F"

  [[group.shortcut]]
  title = "Toggle Terminal"
  i18n = { zh-Hans = "显示或隐藏终端", zh-Hant = "顯示或隱藏終端機", ja = "ターミナルの表示切替" }
  keys = "Ctrl+`"

  [[group.shortcut]]
  title = "Toggle the Left Dock"
  i18n = { zh-Hans = "显示或隐藏左侧面板", zh-Hant = "顯示或隱藏左側面板", ja = "左ドックの表示切替" }
  keys = "Cmd+B"

[[group]]
title = "Editing"
i18n = { zh-Hans = "编辑", zh-Hant = "編輯", ja = "編集" }

  [[group.shortcut]]
  title = "Toggle Line Comment"
  i18n = { zh-Hans = "切换行注释", zh-Hant = "切換行註解", ja = "行コメントの切替" }
  keys = "Cmd+/"

  [[group.shortcut]]
  title = "Select Next Occurrence"
  i18n = { zh-Hans = "选中下一个相同内容", zh-Hant = "選取下一個相同內容", ja = "次の一致箇所を選択" }
  keys = "Cmd+D"

  [[group.shortcut]]
  title = "Move Line Up"
  i18n = { zh-Hans = "上移当前行", zh-Hant = "上移目前行", ja = "行を上へ移動" }
  keys = "Option+Up"

  [[group.shortcut]]
  title = "Move Line Down"
  i18n = { zh-Hans = "下移当前行", zh-Hant = "下移目前行", ja = "行を下へ移動" }
  keys = "Option+Down"

  [[group.shortcut]]
  title = "Delete Line"
  i18n = { zh-Hans = "删除当前行", zh-Hant = "刪除目前行", ja = "行を削除" }
  keys = "Shift+Cmd+K"

[[group]]
title = "Navigation"
i18n = { zh-Hans = "导航", zh-Hant = "導覽", ja = "ナビゲーション" }

  [[group.shortcut]]
  title = "Go to Line"
  i18n = { zh-Hans = "转到行", zh-Hant = "移至行", ja = "指定行へ移動" }
  keys = "Ctrl+G"

  [[group.shortcut]]
  title = "Go to Symbol in the File"
  i18n = { zh-Hans = "转到文件中的符号", zh-Hant = "移至檔案中的符號", ja = "ファイル内のシンボルへ移動" }
  keys = "Shift+Cmd+O"

  [[group.shortcut]]
  title = "Go to Definition"
  i18n = { zh-Hans = "转到定义", zh-Hant = "移至定義", ja = "定義へ移動" }
  keys = "F12"

  [[group.shortcut]]
  title = "Rename Symbol"
  i18n = { zh-Hans = "重命名符号", zh-Hant = "重新命名符號", ja = "シンボルの名前を変更" }
  keys = "F2"
