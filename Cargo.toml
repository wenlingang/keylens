[workspace]
resolver = "3"
members = ["crates/keylens-core", "crates/keylens-platform", "crates/keylens-macos"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
keylens-core = { path = "crates/keylens-core" }
keylens-platform = { path = "crates/keylens-platform" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
include_dir = "0.7"
keylens-macos = { path = "crates/keylens-macos" }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
