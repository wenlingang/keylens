[workspace]
resolver = "3"
members = ["crates/keylens-core", "crates/keylens-platform"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
keylens-core = { path = "crates/keylens-core" }
keylens-platform = { path = "crates/keylens-platform" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
include_dir = "0.7"
